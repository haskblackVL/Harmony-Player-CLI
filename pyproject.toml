[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "harmony-player-cli"
version = "0.1.0"
description = "Reproductor multimedia interactivo TUI para Linux con audio, video ANSI y ecualizador de sonido"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Harmony Player CLI Team" }
]
keywords = ["terminal", "tui", "music", "audio", "video", "ansi", "textual"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: Multimedia :: Video :: Display",
    "Environment :: Console",
]
dependencies = [
    "textual>=0.40.0",
    "pygame>=2.5.0",
    "mutagen>=1.47.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "av>=10.0.0",
]

[project.scripts]
harmony-player = "harmony_player.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["harmony_player*"]

[tool.setuptools.package-data]
"*" = ["*.tcss"]
